<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0E15" />
    <meta
      name="description"
      content="PiHoleVault - scheduled backups and restore points for your Pi-hole configuration"
    />

    <!--
      No web fonts are loaded. The theme in App.jsx asks for Inter and falls back
      to the system stack, and the Content-Security-Policy in nginx.conf allows
      styles and fonts from this origin only -- a Google Fonts <link> would be
      blocked there anyway, and would leak every visitor's IP to a third party
      from a tool that is meant to run on a private network.
    -->

    <title>PiHoleVault</title>
  </head>
  <body>
    <noscript>PiHoleVault needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
